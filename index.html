<style>
  :root{
    --paper:#F5F5F3;
    --ink:#141414;
    --grey:#6E6E6E;
    --grey-soft:#8A8A8A;
    --line:#D4D4D0;
    --mincho:"Zen Old Mincho", serif;
    --gothic:"Zen Kaku Gothic New", sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--gothic);line-height:1.7;
    -webkit-font-smoothing:antialiased;padding:0 22px 56px;
  }
  .wrap{max-width:480px;margin:0 auto}

  /* ---- header (テキストのみ・ロゴは下部) ---- */
  header{padding:40px 0 20px}
  .show-title{
    font-family:var(--mincho);font-weight:600;font-size:34px;
    letter-spacing:.22em;text-indent:.22em;color:var(--ink);line-height:1.25;
  }
  .show-meta{
    font-family:var(--gothic);font-size:14px;color:var(--grey);
    letter-spacing:.08em;margin-top:12px;
  }
  .rule{width:34px;height:2px;background:var(--ink);margin:20px 0 0}

  /* ---- work ---- */
  .work{padding:22px 0;border-top:1px solid var(--line);scroll-margin-top:14px}
  .work:first-of-type{border-top:none;padding-top:8px}
  .no{
    font-family:var(--mincho);font-size:13px;color:var(--grey-soft);
    letter-spacing:.16em;display:block;margin-bottom:8px;
  }
  .artist{
    font-family:var(--gothic);font-weight:700;font-size:18px;
    letter-spacing:.1em;color:var(--ink);margin-bottom:4px;
  }
  .title{
    font-family:var(--mincho);font-weight:500;font-size:25px;
    line-height:1.45;color:var(--ink);margin-bottom:14px;
  }
  .desc{
    font-family:var(--gothic);font-size:16px;color:var(--ink);line-height:1.9;
  }

  /* ---- bio（折りたたみ・タップで開く。長い略歴でもスクロールが伸びない） ---- */
  details.bio{margin-top:16px;border-left:3px solid var(--ink);padding-left:15px}
  details.bio summary{
    font-family:var(--gothic);font-size:14px;font-weight:700;color:var(--ink);
    letter-spacing:.08em;cursor:pointer;list-style:none;
    display:flex;align-items:center;gap:8px;
  }
  details.bio summary::-webkit-details-marker{display:none}
  details.bio summary::before{
    content:"＋";color:var(--grey);font-size:15px;font-weight:400;
  }
  details.bio[open] summary::before{content:"－"}
  .bio-body{
    font-family:var(--gothic);font-size:14px;color:var(--grey);
    line-height:1.85;margin-top:10px;
  }

  /* 差し替え目印（本番では消してOK） */
  .ph{
    background:rgba(20,20,20,.05);border:1px dashed rgba(20,20,20,.3);
    border-radius:4px;padding:2px 7px;font-size:12px;color:var(--grey);
    letter-spacing:.04em;display:inline-block;margin-bottom:6px;
  }

  /* ---- footer：ロゴのみ ---- */
  footer{margin-top:34px;padding-top:24px;border-top:1px solid var(--line);text-align:center}
  footer img{width:132px;height:auto;opacity:.92}
</style>
</head>
